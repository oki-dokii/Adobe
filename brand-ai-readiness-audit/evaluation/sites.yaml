# Evaluation site matrix. URLs are not imported by marketplace lib code.
# enabled: false skips the origin without deleting the case.

defaults:
  max_seconds: 280
  page_cap: 40

sites:
  - id: example-small
    url: https://example.com/
    site_type: static
    size: small
    expected:
      - tiny static IETF example
      - few or no internal links
    notes: Baseline of a trivial public origin.
    enabled: true
    tags: [static, small]

  - id: jekyll-static
    url: https://jekyllrb.com/
    site_type: static
    size: small
    expected:
      - mostly static HTML
      - documentation-adjacent marketing
    notes: Static-site generator homepage.
    enabled: true
    tags: [static, documentation, small]

  - id: stripe-saas
    url: https://stripe.com/
    site_type: saas
    size: medium
    expected:
      - SaaS marketing
      - possible JS-enhanced layout
      - public pricing may be present or gated
    notes: Representative SaaS marketing origin.
    enabled: true
    tags: [saas, medium, js-possible]

  - id: shopify-ecommerce
    url: https://www.shopify.com/
    site_type: ecommerce
    size: large
    expected:
      - ecommerce platform marketing
      - large template set
    notes: Ecommerce / SaaS hybrid marketing site.
